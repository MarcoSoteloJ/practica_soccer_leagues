<div class="min-h-screen bg-gray-50">
  <div class="mx-auto flex max-w-5xl flex-col gap-6 px-4 py-8">
    <h1 class="text-2xl font-bold text-gray-900">Soccer Leagues</h1>

    <nav class="flex gap-2 border-b border-gray-200">
      <button
        class="-mb-px cursor-pointer border-b-2 px-4 py-2 text-sm font-medium"
        [class.border-blue-600]="activeTab() === 'teams'"
        [class.text-blue-600]="activeTab() === 'teams'"
        [class.border-transparent]="activeTab() !== 'teams'"
        [class.text-gray-500]="activeTab() !== 'teams'"
        (click)="activeTab.set('teams')"
      >
        Teams
      </button>

      <button
        class="-mb-px cursor-pointer border-b-2 px-4 py-2 text-sm font-medium"
        [class.border-blue-600]="activeTab() === 'leagues'"
        [class.text-blue-600]="activeTab() === 'leagues'"
        [class.border-transparent]="activeTab() !== 'leagues'"
        [class.text-gray-500]="activeTab() !== 'leagues'"
        (click)="activeTab.set('leagues')"
      >
        Leagues
      </button>
    </nav>

    <main>
      @if (activeTab() === 'teams') {
        <app-teams />
      } @else {
        <app-leagues />
      }
    </main>
  </div>
</div>
